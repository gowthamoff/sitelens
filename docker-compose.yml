# ─── docker-compose.yml ───────────────────────────────────────
# Site Analysis Platform - Local Development
# Runs the Node.js backend, Martin tile server, and Python NDVI service.
#
# Usage: docker-compose up -d
# ──────────────────────────────────────────────────────────────

version: "3.8"

services:
  # ── Node.js Backend API ──
  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: site-analysis-backend
    ports:
      - "8080:8080"
    environment:
      - DB_TARGET=rds
      - RDS_HOST=${RDS_HOST}
      - RDS_PORT=${RDS_PORT:-5432}
      - RDS_DB=${RDS_DB}
      - RDS_USER=${RDS_USER}
      - RDS_PASS=${RDS_PASS}
      - GOOGLE_PLACES_KEY=${GOOGLE_PLACES_KEY}
      - NDVI_SERVICE_URL=http://ndvi-service:8000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - REDIS_URL=redis://redis:6379
    depends_on:
      ndvi-service:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  # ── Redis (analysis cache) ──
  redis:
    image: redis:7-alpine
    container_name: site-analysis-redis
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    networks:
      - app-network

  # ── Martin Vector Tile Server ──
  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: martin-tiles
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${RDS_USER}:${RDS_PASS}@${RDS_HOST}:${RDS_PORT:-5432}/${RDS_DB}
    networks:
      - app-network

  # ── Python NDVI Service ──
  ndvi-service:
    build:
      context: ./ndvi-service
      dockerfile: Dockerfile
    container_name: ndvi-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
